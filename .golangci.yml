version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G204 # kx starts git, docker and the browser on purpose, never through a shell
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - usestdlibvars

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kubernetix-ai/kx
